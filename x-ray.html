<!DOCTYPE >
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=windows-1252">
<meta content="charset=UTF-8">
<title>3DHOP - 3D Heritage Online Presenter</title>
<!--STYLESHEET-->
<link type="text/css" rel="stylesheet" href="data/3dhop.css">
<!--SPIDERGL-->
<script type="text/javascript" src="data/spidergl.js"></script>
<!--JQUERY-->
<script type="text/javascript" src="data/jquery.js"></script>
<!--PRESENTER-->
<script type="text/javascript" src="data/presenter.js"></script>
<!--3D MODELS LOADING AND RENDERING-->
<script type="text/javascript" src="data/nexus.js"></script>
<script type="text/javascript" src="data/ply.js"></script>
<!--TRACKBALLS-->
<script type="text/javascript" src="data/trackball_sphere.js"></script>
<script type="text/javascript" src="data/trackball_turntable.js"></script>
<script type="text/javascript" src="data/trackball_turntable_pan.js"></script>
<script type="text/javascript" src="data/trackball_pantilt.js"></script>

</head>
<body>
<div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()" style="width: 960px; height: 768px;"><div id="tdhlg">Powered by 3DHOP<br>&nbsp;C.N.R. &nbsp;–&nbsp; I.S.T.I.</div>
 <div id="toolbar" style="">
  <img id="home" title="Home" src="data/home.png"><br>
  <img id="zoomin" title="Zoom In" src="data/zoomin.png"><br>
  <img id="zoomout" title="Zoom Out" src="data/zoomout.png"><br>
  <img id="light_on" title="Disable Light Control" src="data/light_on.png" style="position:absolute; visibility:hidden;">
  <img id="light" title="Enable Light Control" src="data/light.png"><br>
  <img id="sections_on" title="Disable Plane Sections" src="data/sections_on.png" style="position:absolute; visibility:hidden;">
  <img id="sections" title="Enable Plane Sections" src="data/sections.png" style=""><br>
  <img id="full_on" title="Exit Full Screen" src="data/full_on.png" style="position:absolute; visibility:hidden;">
  <img id="full" title="Full Screen" src="data/full.png"><br>
  <img id="x-ray" title="X-Ray On" src="data/x-ray_on.png">

 </div>
 <div id="sections-box" class="output-box" style="left: 65px; top: 242px;">
  <table class="output-table" onmousedown="event.stopPropagation()">
	<tbody><tr><td>Plane</td><td>Position</td><td>Flip</td></tr>
	<tr><td><hr></td><td><hr></td><td><hr></td></tr>
	<tr>
		<td><img id="xplane_on" title="Disable X Axis Section" src="data/sectionX_on.png" onclick="sectionxSwitch()" style="position:absolute; visibility:hidden; border:1px inset;">
			<img id="xplane" title="Enable X Axis Section" src="data/sectionX.png" onclick="sectionxSwitch()"><br></td>
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="xplaneSlider" class="output-input" title="Move X Axis Section Position" min="0" max="1" step="0.01" value="0.5" type="range"></td> 
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="xplaneFlip" class="output-input" title="Flip X Axis Section Direction" type="checkbox"></td></tr>
	<tr>
		<td><img id="yplane_on" title="Disable Y Axis Section" src="data/sectionY_on.png" onclick="sectionySwitch()" style="position:absolute; visibility:hidden; border:1px inset;">
			<img id="yplane" title="Enable Y Axis Section" src="data/sectionY.png" onclick="sectionySwitch()"><br></td>
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="yplaneSlider" class="output-input" title="Move Y Axis Section Position" min="0" max="1" step="0.01" value="0.5" type="range"></td> 
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="yplaneFlip" class="output-input" title="Flip Y Axis Section Direction" type="checkbox"></td></tr>
	<tr>
		<td><img id="zplane_on" title="Disable Z Axis Section" src="data/sectionZ_on.png" onclick="sectionzSwitch()" style="position:absolute; visibility:hidden; border:1px inset;">
			<img id="zplane" title="Enable Z Axis Section" src="data/sectionZ.png" onclick="sectionzSwitch()"><br></td>
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="zplaneSlider" class="output-input" title="Move Y Axis Section Position" min="0" max="1" step="0.01" value="0.5" type="range"></td> 
		<td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);"><input id="zplaneFlip" class="output-input" title="Flip Z Axis Section Direction" type="checkbox"></td></tr></tbody></table>
  <table class="output-table" onmousedown="event.stopPropagation()" style="text-align:right;">
	<tbody><tr>
	 <td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);">Show planes<input id="showPlane" class="output-input" title="Show Section Planes" checked="checked" type="checkbox"></td>
	 <td style="border-radius: 5px; background-color: rgba(125, 125, 125, 0.25);">Show edges<input id="showBorder" class="output-input" title="Show Section Edges" checked="checked" type="checkbox"></td></tr></tbody></table>
 </div>
 <canvas id="draw-canvas" style="background-image: url(skins/backgrounds/light.jpg)" width="960" height="768" tabindex="0">
</canvas></div> 


<script type="text/javascript">
var presenter = null;

function setup3dhop() { 
	presenter = new Presenter("draw-canvas");

	presenter.setScene({
		meshes: {
			"external_model" : { url: "models/singleres/YOR_EXTERNAL_MODEL.ply"},
			"internal_model"           : { url: "models/singleres/YOUR_INTERNAL_MODEL.ply" }

		},
		modelInstances : {
			"external_model" : {
				mesh : "external_model",
			},
			"external_model_trasparente" : {
				mesh : "external_model",
				useTransparency : true,
				alpha : 0.9
			},
			"internal_model" : {
				mesh : "internal_model",
				clippable : false
		}
		},
		trackball: {
			type : SphereTrackball,
			trackOptions : {
				startDistance: 1,
				minMaxDist: [0.1, 3.0]
			}
		},
		space: {
			centerMode: "scene",
			radiusMode: "scene"
		},
		config : {
			showClippingPlanes  : true,
			showClippingBorder  : true,
			clippingBorderSize  : 0.5,
			clippingBorderColor : [0.0, 1.0, 1.0]
		}
	});
}

function actionsToolbar(action) {
	if(action=='home') presenter.resetTrackball(); 
	else if(action=='zoomin') presenter.zoomIn();
	else if(action=='zoomout') presenter.zoomOut(); 
	else if(action=='light' || action=='light_on') { presenter.enableLightTrackball(!presenter.isLightTrackballEnabled()); lightSwitch(); } 
	else if(action=='sections' || action=='sections_on') { sectiontoolReset(); sectiontoolSwitch(); } 
	else if(action=='full' || action=='full_on') fullscreenSwitch();
	else if(action=='x-ray' || action=='full_on') presenter.toggleInstanceVisibilityByName('external_model', true);
}

$(document).ready(function(){
	init3dhop();

	setup3dhop();

	sectiontoolInit();
});
</script>


</body></html>
