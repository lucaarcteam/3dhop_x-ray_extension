<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<meta charset="UTF-8"/>
<title>3DHOP X-Ray Extension</title>
<!--STYLESHEET-->
<link type="text/css" rel="stylesheet" href="stylesheet/3dhop.css"/>
<style>
	/* classic 3DHOP layout: the viewer fills the whole browser window */
	html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }

	/* --- v2.0 : real-time X-Ray intensity slider ------------------------------------ */
	#xray-slider {
		position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
		display:flex; align-items:center; gap:10px;
		padding:6px 14px; border-radius:6px;
		background-color:rgba(50,50,50,0.55); color:#f8f8f8;
		font-family:verdana; font-style:italic; font-size:12px;
		-webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
		touch-action:none; -ms-touch-action:none;
		z-index:20;
	}
	#xray-slider label { cursor:default; }
	#xray-slider input[type=range] { width:230px; cursor:pointer; }
	#xrayValue { width:42px; text-align:right; }
</style>
<!--SPIDERGL-->
<script type="text/javascript" src="js/spidergl.js"></script>
<!--JQUERY-->
<script type="text/javascript" src="js/jquery.js"></script>
<!--PRESENTER-->

<!--3D MODELS LOADING AND RENDERING-->
<script type="text/javascript" src="js/nexus.js"></script>
<script type="text/javascript" src="js/ply.js"></script>
<!--TRACKBALLS-->
<script type="text/javascript" src="js/trackball_turntable.js"></script>

</head>
<body>
<div id="3dhop" class="tdhop" onmousedown="if (event.preventDefault) event.preventDefault()"><div id="tdhlg"></div>
 <div id="toolbar">

<!--ZOOM-->

<!--ZOOM-->
<!--LIGHT-->

  <img id="light"       title="Enable Light Control"   src="skins/dark/lightcontrol.png"/><br/>
<!--LIGHT-->
<!--MEASURE-->

  <img id="measure"     title="Enable Measure Tool"    src="skins/dark/measure.png"/><br/>
<!--MEASURE-->
<!--SECTIONS-->
  <img id="sections_on" title="Disable Plane Sections" src="skins/dark/sections_on.png" style="position:absolute; visibility:hidden;"/>
  <img id="sections"    title="Enable Plane Sections"  src="skins/dark/sections.png"/><br/>
<!--SECTIONS-->
<!--X-RAY-->
  <img id="x-ray_on"    title="Disable X-Ray"          src="skins/dark/x-ray_on.png" style="position:absolute; visibility:hidden;"/>
  <img id="x-ray"       title="Enable X-Ray"           src="skins/dark/x-ray.png"/><br/>
<!--X-RAY-->
<!--FULLSCREEN-->
  <img id="full_on"     title="Exit Full Screen"       src="skins/dark/full_on.png" style="position:absolute; visibility:hidden;"/>
  <img id="full"        title="Full Screen"            src="skins/dark/full.png"/>
<!--FULLSCREEN-->
 </div>

<!--MEASURE-->
 <div id="measure-box" class="output-box">Lunghezza misurata<hr/><span id="measure-output" class="output-text" onmousedown="event.stopPropagation()">0.0</span></div>
<!--MEASURE-->

<!--SECTIONS-->
 <div id="sections-box" class="output-box">
  <table class="output-table" onmousedown="event.stopPropagation()">
	<tr><td>Plane</td><td>Position</td><td>Flip</td></tr>
	<tr>
		<td><img   id="xplane_on"    title="Disable X Axis Section" src="skins/icons/sectionX_on.png" onclick="sectionxSwitch()" style="position:absolute; visibility:hidden; border:1px inset;"/>
			<img   id="xplane"       title="Enable X Axis Section"  src="skins/icons/sectionX.png"  onclick="sectionxSwitch()"/><br/></td>
		<td><input id="xplaneSlider" class="output-input" type="range"    title="Move X Axis Section Position"/></td>
		<td><input id="xplaneFlip"   class="output-input" type="checkbox" title="Flip X Axis Section Direction"/></td></tr>
	<tr>
		<td><img   id="yplane_on"    title="Disable Y Axis Section" src="skins/icons/sectionY_on.png" onclick="sectionySwitch()" style="position:absolute; visibility:hidden; border:1px inset;"/>
			<img   id="yplane"       title="Enable Y Axis Section"  src="skins/icons/sectionY.png"  onclick="sectionySwitch()"/><br/></td>
		<td><input id="yplaneSlider" class="output-input" type="range"    title="Move Y Axis Section Position"/></td>
		<td><input id="yplaneFlip"   class="output-input" type="checkbox" title="Flip Y Axis Section Direction"/></td></tr>
	<tr>
		<td><img   id="zplane_on"    title="Disable Z Axis Section" src="skins/icons/sectionZ_on.png" onclick="sectionzSwitch()" style="position:absolute; visibility:hidden; border:1px inset;"/>
			<img   id="zplane"       title="Enable Z Axis Section"  src="skins/icons/sectionZ.png"  onclick="sectionzSwitch()"/><br/></td>
		<td><input id="zplaneSlider" class="output-input" type="range"    title="Move Z Axis Section Position"/></td>
		<td><input id="zplaneFlip"   class="output-input" type="checkbox" title="Flip Z Axis Section Direction"/></td></tr></table>
  <table class="output-table" onmousedown="event.stopPropagation()" style="text-align:right;">
	<tr>
	 <td>Show planes<input id="showPlane" class="output-input" type="checkbox" title="Show Section Planes" style="bottom:-3px;"/></td>
	 <td>Show edges<input  id="showBorder" class="output-input" type="checkbox" title="Show Section Edges" style="bottom:-3px;"/></td></tr></table>
 </div>
<!--SECTIONS-->

 <canvas id="draw-canvas" style="background-image: url('skins/backgrounds/dark_mano_della_morte.jpg');"></canvas>

<!--X-RAY INTENSITY SLIDER (v2.0)-->
 <div id="xray-slider" onmousedown="event.stopPropagation()" title="0% = mano trasparente (solo scheletro) &#183; 100% = mano opaca">
  <label for="xrayRange">Intensità&#160;X-Ray</label>
  <input id="xrayRange" type="range" min="0" max="100" step="1" value="90"/>
  <span id="xrayValue">90%</span>
 </div>
<!--X-RAY INTENSITY SLIDER (v2.0)-->
</div>
</body>

<script type="text/javascript">
var presenter = null;

// X-Ray transparency. The container shell is rendered with CLASSIC alpha
// compositing (see the blend rewrite in setup3dhop), so alpha ~= opacity:
//   slider 100% -> shell fully OPAQUE  (transparency switched off: normal render)
//   slider   0% -> shell fully TRANSPARENT (invisible: only the skeleton shows)
//   in between  -> smooth fade, alpha = pct/100 (higher = more opaque)
// Default 90% = a slightly transparent hand (near-opaque). Same tool as the
// Similaun-mummy project.
var XRAY_ALPHA     = 0.9;       // default opacity
var XRAY_ALPHA_MIN = 0.0001;    // the 3DHOP API treats alpha 0 as "not provided"; use a tiny value
var xrayPercent      = Math.round(XRAY_ALPHA * 100);   // current slider value (90)
var lastGhostPercent = xrayPercent;                    // last x-ray value < 100 (used by the toggle)

function setup3dhop() {
	presenter = new Presenter("draw-canvas");

	// --- X-Ray: use classic alpha compositing for the transparent shell -------- //
	// Stock 3DHOP renders transparent instances ADDITIVELY (blendFunc
	// SRC_ALPHA, ONE = "src + dst"): the object behind is never attenuated, so the
	// shell can never look truly opaque and there is a hard visual "jump" when we
	// switch to the normal pass at 100%.
	// Here we rewrite ONLY that one blend call to standard alpha blending
	// (SRC_ALPHA, ONE_MINUS_SRC_ALPHA = "src*a + dst*(1-a)"), so the shell opacity
	// grows smoothly: alpha 1 -> opaque, alpha 0 -> invisible.
	// The measure / picked-point overlays also call (SRC_ALPHA, ONE) but with
	// depthFunc GREATER (they must stay glowing beyond the geometry), so we detect
	// them via depthFunc and leave them additive. The shared 3DHOP core is untouched.
	(function useAlphaForTransparency(gl) {
		var currentDepthFunc = gl.LESS;                       // onInitialize sets LESS
		var realDepthFunc = gl.depthFunc.bind(gl);
		gl.depthFunc = function (func) { currentDepthFunc = func; return realDepthFunc(func); };

		var realBlendFunc = gl.blendFunc.bind(gl);
		gl.blendFunc = function (sfactor, dfactor) {
			if (sfactor === gl.SRC_ALPHA && dfactor === gl.ONE && currentDepthFunc !== gl.GREATER)
				return realBlendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
			return realBlendFunc(sfactor, dfactor);
		};
	})(presenter.ui.gl);

	presenter.setScene({
		meshes: {
			"external_mesh" : { url : "models/hand_skin.ply"  },   // outer surface (skin)
			"internal_mesh" : { url : "models/hand_bones.ply" },   // inner skeleton (bones)
			"ring_mesh"     : { url : "models/hand_rings.ply" }    // rings (visible in x-ray)
		},
		modelInstances : {
			"external_model" : {
				mesh            : "external_mesh",
				color           : [1.00, 0.87, 0.82],   // light flesh / incarnato chiaro
				useSolidColor   : true,
				backfaceColor   : [1.0, 1.0, 1.0, 0.0]  // do not darken back faces
			},
			"internal_model" : {
				mesh            : "internal_mesh",
				color           : [0.94, 0.91, 0.82],
				useSolidColor   : true,
				backfaceColor   : [1.0, 1.0, 1.0, 0.0],
				clippable       : false
			},
			"ring_model" : {
				mesh            : "ring_mesh",
				color           : [0.62, 0.62, 0.64],   // grey metal
				useSolidColor   : true,
				backfaceColor   : [1.0, 1.0, 1.0, 0.0],
				clippable       : false
			}
		},
		trackball: {
			type : SphereTrackball,
			trackOptions : {
				startPhi : 30.0,
				startTheta : 15.0,
				startDistance : 1.4,
				minMaxDist : [0.3, 6.0]
			}
		},
		space: {
			centerMode : "scene",
			radiusMode : "scene"
		},
		config : {
			showClippingPlanes  : true,
			showClippingBorder  : true,
			clippingBorderSize  : 0.5,
			clippingBorderColor : [0.0, 1.0, 1.0]
		}
	});

	//--SECTIONS--
	sectiontoolInit();
	//--SECTIONS--

	//--MEASURE--
	presenter._onEndMeasurement = onEndMeasure;
	//--MEASURE--
}

// +++ X-RAY +++ //
// Reconcile the whole UI to a given slider percentage and apply it to the shell.
function applyXrayPercent(pct, syncUI) {
	pct = Math.max(0, Math.min(100, Math.round(pct)));
	xrayPercent = pct;

	if (pct >= 100) {
		// 100% = fully opaque shell: normal, depth-tested rendering (skeleton hidden)
		presenter.setInstanceTransparencyByName('external_model', false, true);
	} else {
		// 0..99% = alpha-blended shell; alpha 0 is falsy in the 3DHOP API, so clamp it
		var alpha = Math.max(pct / 100.0, XRAY_ALPHA_MIN);
		presenter.setInstanceTransparencyByName('external_model', true, true, alpha);
	}

	if (syncUI) {
		jQuery('#xrayRange').val(pct);
		jQuery('#xrayValue').text(pct + '%');
	}

	// toolbar icon reflects "x-ray active" = anything below fully opaque
	if (pct < 100) {
		jQuery('#x-ray').css("visibility", "hidden");
		jQuery('#x-ray_on').css("visibility", "visible");
	} else {
		jQuery('#x-ray_on').css("visibility", "hidden");
		jQuery('#x-ray').css("visibility", "visible");
	}
}

// Toolbar button: on/off shortcut.
// OFF -> fully opaque (100%); ON -> the last x-ray value below 100% (default 90%).
function xraySwitch() {
	if (xrayPercent >= 100) applyXrayPercent(lastGhostPercent, true);
	else                    applyXrayPercent(100, true);
}

// Real-time slider: 0% = fully transparent, 100% = fully opaque, live.
function xraySliderUpdate(value) {
	var pct = parseInt(value, 10);
	if (isNaN(pct)) pct = Math.round(XRAY_ALPHA * 100);
	pct = Math.max(0, Math.min(100, pct));
	if (pct < 100) lastGhostPercent = pct;
	jQuery('#xrayValue').text(pct + '%');
	applyXrayPercent(pct, false);
}
// +++ X-RAY +++ //

// +++ MEASURE TOOL +++ //
// Calibration: the source left hand (Z-Anatomy) spans 149.27 mm along its max
// dimension; our models are normalised so that dimension = 1.0 (the combined
// meshes span exactly 1.0 along their longest axis), hence 1 measured unit
// equals 149.27 mm.
//
// NOTE: 3DHOP's measurement is already expressed in RAW model units, so the
// viewer's framing rescale must NOT be applied here. The picked depth is
// unprojected through the inverse of (projection * view * model), and the
// "model" matrix already carries the scene scale
//   sceneRadiusInv = 1 / (Rmax * sqrt(3))   with Rmax = max(datasetRadius)
// so that rescale cancels out (space/instance/mesh transforms are identity).
// The previous value (179.4712 = 149.27 / sceneRadiusInv) overestimated every
// measurement by ~20%.
var MEASURE_MM_PER_UNIT = 149.27;   // mm per measured unit

function onEndMeasure(measure) {
	jQuery('#measure-output').html((measure * MEASURE_MM_PER_UNIT).toFixed(1) + " mm");
}
// +++ MEASURE TOOL +++ //

function actionsToolbar(action) {
	if(action=='home') presenter.resetTrackball();
	else if(action=='zoomin') presenter.zoomIn();
	else if(action=='zoomout') presenter.zoomOut();
	else if(action=='light' || action=='light_on') { presenter.enableLightTrackball(!presenter.isLightTrackballEnabled()); lightSwitch(); }
	else if(action=='measure' || action=='measure_on') { presenter.enableMeasurementTool(!presenter.isMeasurementToolEnabled()); measureSwitch(); }
	else if(action=='sections' || action=='sections_on') { sectiontoolReset(); sectiontoolSwitch(); }
	else if(action=='x-ray' || action=='x-ray_on') xraySwitch();
	else if(action=='full' || action=='full_on') fullscreenSwitch();
}

$(document).ready(function(){
	init3dhop();

	setup3dhop();

	// v2.0 : wire the real-time X-Ray intensity slider
	jQuery('#xrayRange').on('input change', function(){
		xraySliderUpdate(this.value);
	});

	// start with the shell slightly transparent (default 90% = slightly transparent hand)
	applyXrayPercent(xrayPercent, true);
});
</script>

</body>
</html>
